# 部署由 Vercel 的 GitHub 整合負責（push 到 main 會自動觸發 production 部署），
# 這裡只做建置驗證。
#
# 原本這個 workflow 有一個 deploy-vercel job，使用 amondnet/vercel-action 搭配
# VERCEL_TOKEN / ORG_ID / PROJECT_ID secrets；那些 secrets 從未設定過，
# 導致 job 每次都以 "Input required and not supplied: vercel-token" 失敗。
# 改用原生整合後不需要 secrets，因此移除該 job。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: "file:./prisma/test.db"
          NEXTAUTH_SECRET: "test-secret-for-build"
          NEXTAUTH_URL: "http://localhost:3000"

      - name: Check for build artifacts
        run: |
          if [ ! -d ".next" ]; then
            echo "Build failed - .next directory not found"
            exit 1
          fi
          echo "Build successful!"
