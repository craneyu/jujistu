# Netlify 部署設定（備選平台）
#
# 本專案目前實際部署在 Vercel（見 vercel.json）。這個檔案是為了讓 Netlify
# 也能一鍵部署而保留的，兩邊共用 package.json 的 build:deploy。
#
# 沒有這個檔案時 Netlify 會沿用 package.json 的 `npm run build`，
# 而該指令的 turbopack 與 postbuild 在部署環境並不適用。
#
# 資料庫使用 Postgres：DATABASE_URL 必須在 Netlify UI 的
# Environment variables 設定（build 與 runtime 都要讀得到），
# 不要寫在這個檔案裡——[build.environment] 只在 build 期間有效，
# 而且連線字串屬於機密，不該進版控。

[build]
  command = "npm run build:deploy"
  publish = ".next"

[build.environment]
  # Next.js 15 需要 Node 18.18+。固定版本避免 Netlify 預設值變動造成 build 漂移；
  # 22 是本機驗證過的版本。
  NODE_VERSION = "22"
  PRISMA_HIDE_UPDATE_MESSAGE = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
